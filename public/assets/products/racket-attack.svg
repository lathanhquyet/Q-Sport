<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="16" fill="#E8FFF3"/>
  <!-- Court Pattern Lines -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#B8F2D1" stroke-width="2"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#B8F2D1" stroke-width="2"/>

  <!-- Racket Head Oval -->
  <ellipse cx="200" cy="130" rx="65" ry="85" fill="none" stroke="#087F5B" stroke-width="10"/>
  <ellipse cx="200" cy="130" rx="61" ry="81" fill="none" stroke="#FF795B" stroke-width="3"/>

  <!-- Racket Strings Grid -->
  <g stroke="#087F5B" stroke-width="1.5" opacity="0.4">
    <line x1="160" y1="70" x2="160" y2="190"/><line x1="175" y1="55" x2="175" y2="205"/>
    <line x1="190" y1="48" x2="190" y2="212"/><line x1="205" y1="48" x2="205" y2="212"/>
    <line x1="220" y1="55" x2="220" y2="205"/><line x1="235" y1="70" x2="235" y2="190"/>
    <line x1="140" y1="100" x2="260" y2="100"/><line x1="130" y1="120" x2="270" y2="120"/>
    <line x1="130" y1="140" x2="270" y2="140"/><line x1="140" y1="160" x2="260" y2="160"/>
  </g>

  <!-- Throat / T-Joint -->
  <path d="M182 208 L200 230 L218 208 Z" fill="#FF795B"/>
  
  <!-- Shaft -->
  <rect x="196" y="225" width="8" height="110" rx="3" fill="#122B24"/>
  <rect x="198" y="235" width="4" height="90" fill="#087F5B"/>

  <!-- Handle / Grip -->
  <rect x="192" y="325" width="16" height="55" rx="4" fill="#FFB938"/>
  <path d="M192 335 L208 340 M192 350 L208 355 M192 365 L208 370" stroke="#122B24" stroke-width="2"/>

  <!-- Badge Tag -->
  <rect x="250" y="30" width="120" height="30" rx="15" fill="#FF795B"/>
  <text x="310" y="50" text-anchor="middle" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">PRO ATTACK 100</text>
</svg>
