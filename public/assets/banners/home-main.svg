<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#122b24"/>
      <stop offset="100%" stop-color="#087f5b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bannerGrad)" rx="16"/>
  <!-- Badminton Court lines -->
  <line x1="100" y1="50" x2="1100" y2="50" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="100" y1="350" x2="1100" y2="350" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="600" y1="50" x2="600" y2="350" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Shuttlecock silhouette -->
  <circle cx="1020" cy="200" r="110" fill="#10b981" fill-opacity="0.1"/>
  <!-- Typography -->
  <text x="120" y="160" font-family="'Barlow Condensed', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="2">Q-SPORT PERFORMANCE</text>
  <text x="120" y="215" font-family="'Be Vietnam Pro', sans-serif" font-size="22" font-weight="600" fill="#10b981">DỤNG CỤ CẦU LÔNG &amp; PHỤ KIỆN THỂ THAO CHÍNH HÃNG</text>
  <text x="120" y="260" font-family="'Be Vietnam Pro', sans-serif" font-size="16" fill="#cbd5e1">Bứt phá giới hạn - Tốc độ, độ bền và cảm giác cầu đỉnh cao trong từng trận đấu</text>
</svg>
